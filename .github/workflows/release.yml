name: Professional Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version (e.g., 1.0.1). If empty, reads gradle.properties'
        required: false
        default: ''
      custom_changelog:
        description: 'Custom changelog notes (Markdown supported)'
        required: false
        default: 'Shadow v1 Release'
      is_prerelease:
        description: 'Mark as Pre-release?'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolve Version
        id: versioning
        run: |
          # Priority: Input > gradle.properties
          INPUT_VERSION="${{ github.event.inputs.release_version }}"
          GRADLE_VERSION=$(grep VERSION_NAME gradle.properties | cut -d'=' -f2 | tr -d '\r')
          FINAL_VERSION="${INPUT_VERSION:-$GRADLE_VERSION}"
          echo "version=$FINAL_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$FINAL_VERSION" >> $GITHUB_OUTPUT

      - name: Prepare Signing Key
        run: |
          # Use the root directory for simpler pathing
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          if [ ! -s release.keystore ]; then
            echo "Keystore decoding failed"
            exit 1
          fi

      - name: Build Release APK
        run: |
          chmod +x gradlew
          # Using absolute path for the keystore to avoid daemon path issues
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Prepare Artifact
        run: |
          cp app/build/outputs/apk/release/app-release.apk shadow-${{ steps.versioning.outputs.version }}.apk

      - name: Generate Combined Changelog
        id: changelog
        run: |
          echo "BODY<<EOF" >> $GITHUB_OUTPUT
          echo "### 📝 Notes" >> $GITHUB_OUTPUT
          echo "${{ github.event.inputs.custom_changelog }}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### 🚀 Technical Changes" >> $GITHUB_OUTPUT
          
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            git log --pretty=format:"- %s" >> $GITHUB_OUTPUT
          else
            git log ${LAST_TAG}..HEAD --pretty=format:"- %s" >> $GITHUB_OUTPUT
          fi
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: Shadow ${{ steps.versioning.outputs.version }}
          body: ${{ steps.changelog.outputs.BODY }}
          prerelease: ${{ github.event.inputs.is_prerelease }}
          files: |
            shadow-${{ steps.versioning.outputs.version }}.apk
            app/build/outputs/mapping/release/mapping.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
