name: Signed Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ---------- DECODE KEYSTORE ----------
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Export signing env
        run: |
          echo "CI=true" >> $GITHUB_ENV
          echo "KEYSTORE_FILE=keystore.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      # ---------- VERSION ----------
      - name: Extract version
        id: version
        run: |
          VERSION_NAME=$(grep VERSION_NAME gradle.properties | cut -d'=' -f2)
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT

      # ---------- PREVENT DUPLICATE RELEASE ----------
      - name: Check if release exists
        id: check
        run: |
          if gh release view v${{ steps.version.outputs.name }} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop if already released
        if: steps.check.outputs.exists == 'true'
        run: exit 0

      # ---------- BUILD ----------
      - name: Grant permission
        run: chmod +x gradlew

      - name: Build Signed APK
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk shadow-v${{ steps.version.outputs.name }}.apk

      # ---------- CHANGELOG ----------
      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "## Changes" >> $GITHUB_OUTPUT
          if [ -z "$LAST_TAG" ]; then
            git log --pretty=format:"- %s" >> $GITHUB_OUTPUT
          else
            git log ${LAST_TAG}..HEAD --pretty=format:"- %s" >> $GITHUB_OUTPUT
          fi
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ---------- RELEASE ----------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Shadow v${{ steps.version.outputs.name }}
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          files: shadow-v${{ steps.version.outputs.name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
