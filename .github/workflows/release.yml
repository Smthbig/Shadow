name: Release Build

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version (e.g., 2.0.0). If empty, reads from build.gradle.kts'
        required: false
        default: ''
      custom_changelog:
        description: 'Custom changelog notes (Markdown supported)'
        required: false
        default: ''
      is_prerelease:
        description: 'Mark as Pre-release?'
        type: boolean
        default: false

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8"

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26c
          build-tools-version: 34.0.0

      - name: Resolve Version
        id: versioning
        run: |
          INPUT_VERSION="${{ github.event.inputs.release_version }}"
          if [ -n "$INPUT_VERSION" ]; then
            FINAL_VERSION="$INPUT_VERSION"
          else
            # Extract from gradle.properties first
            FINAL_VERSION=$(grep '^VERSION_NAME=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
            # Fallback to build.gradle.kts
            if [ -z "$FINAL_VERSION" ]; then
              FINAL_VERSION=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            fi
          fi
          if [ -z "$FINAL_VERSION" ]; then
            echo "Could not determine version"
            exit 1
          fi
          echo "version=$FINAL_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$FINAL_VERSION" >> $GITHUB_OUTPUT

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Run lint
        run: ./gradlew lintRelease --no-daemon

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest --no-daemon

      - name: Prepare Signing Key
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          if [ ! -s release.keystore ]; then
            echo "Keystore decoding failed or empty"
            exit 1
          fi

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            --no-daemon

      - name: Verify APK signature
        run: |
          APK_PATH=app/build/outputs/apk/release/app-release.apk
          apksigner verify --print-certs "$APK_PATH"

      - name: Prepare Artifact
        run: |
          cp app/build/outputs/apk/release/app-release.apk shadow-${{ steps.versioning.outputs.version }}.apk

      - name: Generate Combined Changelog
        id: changelog
        run: |
          echo "BODY<<EOF" >> $GITHUB_OUTPUT
          echo "## Shadow v${{ steps.versioning.outputs.version }}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          
          if [ -n "${{ github.event.inputs.custom_changelog }}" ]; then
            echo "### Notes" >> $GITHUB_OUTPUT
            echo "${{ github.event.inputs.custom_changelog }}" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
          fi
          
          echo "### Changes" >> $GITHUB_OUTPUT
          
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            git log --pretty=format:"- %s (%h)" >> $GITHUB_OUTPUT
          else
            git log ${LAST_TAG}..HEAD --pretty=format:"- %s (%h)" >> $GITHUB_OUTPUT
          fi
          echo "" >> $GITHUB_OUTPUT
          echo "---" >> $GITHUB_OUTPUT
          echo "*Built from commit \`${{ github.sha }}\`*" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: Shadow ${{ steps.versioning.outputs.version }}
          body: ${{ steps.changelog.outputs.BODY }}
          prerelease: ${{ github.event.inputs.is_prerelease }}
          draft: false
          make_latest: true
          files: |
            shadow-${{ steps.versioning.outputs.version }}.apk
            app/build/outputs/mapping/release/mapping.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadow-release-${{ steps.versioning.outputs.version }}
          path: |
            shadow-${{ steps.versioning.outputs.version }}.apk
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
