name: Nightly Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest

    steps:

      # -------------------------------
      # HARD DISABLE CHECK
      # -------------------------------
      - name: Check if nightly is enabled
        run: |
          if [ "${{ vars.NIGHTLY_ENABLED }}" != "true" ]; then
            echo "Nightly disabled. Skipping workflow."
            exit 0
          fi

      # -------------------------------
      # Checkout
      # -------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk shadow-nightly.apk

      - name: Generate changelog
        id: changelog
        run: |
          LAST_MSG=$(git log -1 --pretty=%s)
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "### Nightly Build" >> $GITHUB_OUTPUT
          echo "- Commit: $SHORT_SHA" >> $GITHUB_OUTPUT
          echo "- Message: $LAST_MSG" >> $GITHUB_OUTPUT
          echo "- Built at: $DATE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create/Update Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          prerelease: true
          files: shadow-nightly.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}