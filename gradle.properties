#AndroidIDE: enforce UTF-8 & locale for Gradle daemon
#Sun Apr 05 14:19:18 GMT 2026
android.nonTransitiveRClass=true
android.useAndroidX=true
kotlin.code.style=official
org.gradle.daemon.performance.disable-logging=true
org.gradle.jvmargs=-Xmx2048m -XX\:MaxMetaspaceSize\=1024m -Dfile.encoding\=UTF-8 -Dsun.jnu.encoding\=UTF-8 -Duser.language\=en -Duser.country\=US
systemProp.file.encoding=UTF-8
systemProp.sun.jnu.encoding=UTF-8
systemProp.user.country=US
systemProp.user.language=en
